  <text x="210" y="66" text-anchor="middle" fill="#e6edf3"
        font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace"
        font-size="60" font-weight="700">MyConstant</text>
  <line x1="60" y1="86" x2="360" y2="86" stroke="#e6edf3" stroke-width="1" opacity="0.4"/>
</svg>
